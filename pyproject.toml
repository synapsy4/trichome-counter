[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trichomecounter"
version = "0.1.0"
description = "Deep learning project for automated trichome detection and counting."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "scipy==1.15.3",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "tqdm==4.67.1",
    "segmentation-models-pytorch==0.5.0",
    "matplotlib==3.10.8",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]